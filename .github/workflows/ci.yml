name: CI

# Harness 闭环里的独立验证环节（docs/harness/goal_workflow.md 第 4 阶段）。
# 本机 ./ci.ps1 的输出是自述的——同一个 agent 实现、验证、誊抄证据；
# 这条流水线跑在 GitHub 的 Linux runner 上，验收报告引用它的 run URL 作为工程证据。
#
# 刻意不跑 Playwright：验收截图需要真实渲染，而页面数据来自东财/腾讯等国内财经接口，
# GitHub 的美国 runner 打过去会超时。截图那一环留在本机。

on:
  push:
    branches: [dev, main, "goal/**"]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

jobs:
  frontend:
    name: 前端类型检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 安装依赖
        working-directory: frontend
        run: npm ci
      # 仓库无 ESLint / Prettier，tsc 就是唯一的类型闸门
      - name: tsc -b
        working-directory: frontend
        run: npx tsc -b

  backend:
    name: 后端离线测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      # 装完整 requirements.txt（含 akshare / mootdx / pandas）而非精简版：
      # 离线测试理论上不碰它们（惰性导入 + 501 兜底），但按完整依赖装更忠实于本机环境，
      # 避免出现「CI 绿、本机红」这种最难查的差异。
      - name: 安装依赖
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      # conftest.py 会把 VR_DATA_DIR 指到临时目录，不会碰到任何真实用户数据
      - name: pytest（离线）
        working-directory: backend
        run: pytest -q -m "not live"
      - name: import 自检
        working-directory: backend
        run: python -c "import app; print(f'{len(app.app.routes)} 条路由')"
